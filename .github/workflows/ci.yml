name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e ".[test,quality]"
      - name: Validate catalog data
        run: python scripts/validate_data.py
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy career_radar scripts
      - name: Test with branch coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage combine
          coverage report
