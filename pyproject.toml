[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-radar"
version = "0.1.0"
description = "Evidence-first career intelligence data foundation"
requires-python = ">=3.11"
dependencies = [
  "FastAPI>=0.116,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2.12,<3"]

[tool.setuptools.packages.find]
include = ["career_radar*"]

[tool.setuptools.package-data]
career_radar = ["web/*.html", "web/*.css", "web/*.js"]
