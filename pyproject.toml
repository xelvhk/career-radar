[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-radar"
version = "0.1.0"
description = "Evidence-first career intelligence data foundation"
requires-python = ">=3.11"
dependencies = [
  "FastAPI>=0.116,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2.12,<3"]
quality = [
  "coverage[toml]>=7.10,<8",
  "mypy>=2.3,<3",
  "ruff>=0.14,<1",
  "types-PyYAML>=6.0,<7",
]
mutation = [
  "mutmut>=3,<4",
  "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
include = ["career_radar*"]

[tool.setuptools.package-data]
career_radar = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "C901", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["career_radar"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["career_radar/"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
use_setproctitle = false
